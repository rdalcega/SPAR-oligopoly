# Per-model settings, held fixed across every cell (DECISIONS.md §6 item 9). The table name is the model's
# short name used on the command line and in output file names.
#
# Keys: model (OpenRouter id), provider (endpoint tag to pin, fallbacks off), temperature, top_p,
# top_k (optional), max_tokens, reasoning (OpenRouter reasoning object), require_parameters,
# cache_control (optional, default true: add a cache breakpoint on the newest message),
# pricing (optional, USD per million tokens; used by --dry-run instead of live endpoint pricing),
# timeout_s (optional HTTP timeout per call, default 900 s; a timed-out call is charged its reservation).
# max_tokens is required for live models: the budget reserves its cost before every call.
#
# provider = "TODO" until the provider probe has picked an endpoint: the runner refuses live calls for it.
# Sampling values below are placeholders taken from the model cards' reasoning-mode recommendations as far as
# known; confirm each against its card before the sweep.

[mock]
model = "mock"
provider = "mock"
temperature = 1.0
top_p = 1.0
max_tokens = 4096
reasoning = { effort = "medium" }
require_parameters = true
# Illustrative prices of a small open-weight model, for dry-run estimates only.
pricing = { prompt = 0.10, completion = 0.40, input_cache_read = 0.025 }

