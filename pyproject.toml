[project]
name = "oligopoly"
version = "0.1.0"
description = "LLM replications of Fonseca & Normann (2012) repeated Bertrand oligopoly experiments"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=3.0.6",
    "python-dotenv>=1.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oligopoly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
